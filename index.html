<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawihfy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070b14; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4">
    <h1 class="text-2xl font-bold text-emerald-400 mb-6 uppercase tracking-tighter">KAWIHFY</h1>
    
    <input type="text" id="q" placeholder="Cari lagu Sunda..." class="w-full p-4 glass rounded-2xl outline-none mb-6">

    <div id="results" class="space-y-2"></div>

    <div id="player" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-3xl hidden shadow-2xl">
        <div class="flex items-center gap-4 mb-3 text-sm font-bold" id="info">Memutar...</div>
        <audio id="audio" controls class="w-full h-8"></audio>
    </div>

    <script>
        document.getElementById('q').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const results = document.getElementById('results');
                results.innerHTML = '<p class="text-center">Milari...</p>';
                try {
                    const res = await fetch(`/api?q=${encodeURIComponent(e.target.value)}`);
                    const data = await res.json();
                    results.innerHTML = '';
                    data.forEach(s => {
                        const d = document.createElement('div');
                        d.className = 'p-3 glass rounded-xl flex justify-between items-center';
                        d.innerHTML = `<span>${s.title}</span><i class="fa-solid fa-play text-emerald-400"></i>`;
                        d.onclick = () => play(s);
                        results.appendChild(d);
                    });
                } catch (err) { results.innerHTML = '<p class="text-red-400 text-center">Gagal, pastikan buka di Vercel, Tuan!</p>'; }
            }
        });

        async function play(s) {
            const p = document.getElementById('player');
            p.classList.remove('hidden');
            document.getElementById('info').innerText = s.title;
            try {
                const res = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: `https://www.youtube.com/watch?v=${s.videoId}`, downloadMode: 'audio' })
                });
                const data = await res.json();
                if (data.url) {
                    const a = document.getElementById('audio');
                    a.src = data.url;
                    a.play();
                }
            } catch (err) { alert("Server audio sibuk, Tuan."); }
        }
    </script>
</body>
</html>
