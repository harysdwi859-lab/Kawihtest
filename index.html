<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawihfy - Tembang Sunda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070b14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .song-card { transition: all 0.3s ease; border-radius: 12px; }
        .song-card:hover { background: rgba(52, 211, 153, 0.1); transform: scale(1.02); }
        input::placeholder { color: #94a3b8; }
        /* Custom Audio Player Style */
        audio::-webkit-media-controls-panel { background-color: #1e293b; }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 pb-40">
    
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tighter">KAWIHFY</h1>
            <p class="text-xs text-emerald-600 font-mono tracking-widest uppercase">Sunda Digital Player</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-black font-bold">
            H
        </div>
    </header>

    <div class="relative mb-8">
        <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" id="searchInput" 
               placeholder="Cari lagu Sunda (Degung, Pop Sunda, Doel Sumbang)..." 
               class="w-full p-4 pl-12 glass rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
    </div>

    <div id="playlist" class="grid grid-cols-1 gap-3">
        <div class="text-center py-20">
            <i class="fa-solid fa-music text-5xl text-slate-800 mb-4"></i>
            <p class="text-slate-500">Mangga milari lagu anu dipikaresep, Tuan...</p>
        </div>
    </div>

    <div id="playerBar" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-3xl shadow-2xl flex flex-col gap-3 hidden">
        <div class="flex items-center gap-4">
            <div class="relative">
                <img id="currentPoster" src="" class="w-14 h-14 rounded-xl object-cover shadow-lg">
                <div id="loader" class="absolute inset-0 bg-black/50 flex items-center justify-center rounded-xl hidden">
                    <i class="fa-solid fa-circle-notch loading-spinner text-emerald-400"></i>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <p id="currentTitle" class="font-bold text-sm truncate">Judul Lagu</p>
                <p id="currentArtist" class="text-xs text-emerald-500 truncate font-medium">Artis</p>
            </div>
            <button onclick="closePlayer()" class="text-slate-400 hover:text-white px-2">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <audio id="mainAudio" controls class="w-full h-8"></audio>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const playlist = document.getElementById('playlist');
        const playerBar = document.getElementById('playerBar');
        const mainAudio = document.getElementById('mainAudio');
        const loader = document.getElementById('loader');

        // Fungsi Cari Lagu
        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== "") {
                const query = searchInput.value;
                playlist.innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-circle-notch loading-spinner text-emerald-400 text-3xl"></i></div>';
                
                try {
                    // Sesuai dengan route API di Vercel Tuan
                    const response = await fetch(`/api?q=${encodeURIComponent(query + ' sunda')}`);
                    const data = await response.json();
                    
                    playlist.innerHTML = '';
                    data.forEach(song => {
                        const card = document.createElement('div');
                        card.className = 'song-card p-3 flex items-center gap-4 glass cursor-pointer';
                        card.innerHTML = `
                            <img src="${song.thumbnails[0].url}" class="w-14 h-14 rounded-lg object-cover">
                            <div class="flex-1 overflow-hidden">
                                <p class="font-bold text-sm truncate">${song.title}</p>
                                <p class="text-xs text-slate-400">${song.artists[0].name}</p>
                            </div>
                            <div class="text-emerald-500">
                                <i class="fa-solid fa-circle-play text-2xl"></i>
                            </div>
                        `;
                        card.onclick = () => playSong(song);
                        playlist.appendChild(card);
                    });
                } catch (err) {
                    playlist.innerHTML = '<p class="text-center text-red-400">Aduh, server nuju gangguan, Tuan.</p>';
                }
            }
        });

        // Fungsi Putar Lagu via Cobalt
        async function playSong(song) {
            playerBar.classList.remove('hidden');
            loader.classList.remove('hidden');
            
            document.getElementById('currentPoster').src = song.thumbnails[0].url;
            document.getElementById('currentTitle').innerText = "Nuju nyandak audio...";
            document.getElementById('currentArtist').innerText = song.artists[0].name;

            const videoUrl = `https://www.youtube.com/watch?v=${song.videoId}`;

            try {
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ url: videoUrl, downloadMode: 'audio', audioFormat: 'mp3' })
                });

                const data = await response.json();
                
                if (data.url) {
                    mainAudio.src = data.url;
                    mainAudio.play();
                    document.getElementById('currentTitle').innerText = song.title;
                    loader.classList.add('hidden');
                } else {
                    throw new Error();
                }
            } catch (err) {
                alert("Hapunten Tuan, lagu ieu teu tiasa diputar ayeuna.");
                loader.classList.add('hidden');
            }
        }

        function closePlayer() {
            mainAudio.pause();
            playerBar.classList.add('hidden');
        }
    </script>
</body>
</html>
