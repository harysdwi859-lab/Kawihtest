<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawihfy - Tembang Sunda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070b14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .song-card:hover { background: rgba(52, 211, 153, 0.1); transform: translateY(-2px); }
    </style>
</head>
<body class="p-4 pb-40">
    
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tighter italic">KAWIHFY</h1>
            <p class="text-[10px] text-emerald-600 font-mono tracking-[0.3em] uppercase font-bold">Sunda Digital Player</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-black font-black text-xs border-2 border-emerald-400/50">HARY</div>
    </header>

    <div class="relative mb-8">
        <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">
            <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input type="text" id="searchInput" 
               placeholder="Cari lagu Sunda (Degung, Pop, dll)..." 
               class="w-full p-4 pl-12 glass rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-white placeholder:text-slate-500">
    </div>

    <div id="playlist" class="grid grid-cols-1 gap-3">
        <div class="text-center py-20">
            <i class="fa-solid fa-music text-slate-700 text-5xl mb-4"></i>
            <p class="text-slate-500 font-medium italic">Mangga milari lagu anu dipikaresep, Tuan...</p>
        </div>
    </div>

    <div id="playerBar" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-3xl shadow-2xl flex flex-col gap-3 hidden border-t border-white/10">
        <div class="flex items-center gap-4">
            <div class="relative group">
                <img id="currentPoster" src="" class="w-14 h-14 rounded-xl object-cover shadow-lg">
                <div id="loader" class="absolute inset-0 bg-black/60 flex items-center justify-center rounded-xl hidden">
                    <i class="fa-solid fa-circle-notch loading-spinner text-emerald-400"></i>
                </div>
            </div>
            <div class="flex-1 min-w-0">
                <p id="currentTitle" class="font-bold text-sm truncate text-white uppercase tracking-tight">Pilih Lagu</p>
                <p id="currentArtist" class="text-[11px] text-emerald-500 truncate font-semibold">Artis Sunda</p>
            </div>
            <button onclick="closePlayer()" class="text-slate-500 hover:text-white transition-colors p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <audio id="mainAudio" controls class="w-full h-8 brightness-90 contrast-125"></audio>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const playlist = document.getElementById('playlist');
        const playerBar = document.getElementById('playerBar');
        const mainAudio = document.getElementById('mainAudio');
        const loader = document.getElementById('loader');

        // Fungsi Pencarian
        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && searchInput.value.trim() !== "") {
                const query = searchInput.value;
                playlist.innerHTML = '<div class="text-center py-20"><i class="fa-solid fa-circle-notch loading-spinner text-emerald-400 text-4xl"></i></div>';
                
                try {
                    // Gunakan path relatif /api karena vercel.json sudah dipasang (tanpa spasi)
                    const response = await fetch(`/api?q=${encodeURIComponent(query + ' sunda')}`);
                    const data = await response.json();
                    playlist.innerHTML = '';
                    
                    if (data.length === 0) {
                        playlist.innerHTML = '<p class="text-center py-10 text-slate-500 italic">Hapunten Tuan, laguna teu kapendak.</p>';
                        return;
                    }

                    data.forEach(song => {
                        const card = document.createElement('div');
                        card.className = 'song-card p-3 flex items-center gap-4 glass cursor-pointer mb-2 rounded-xl transition-all duration-200 border border-white/5';
                        card.innerHTML = `
                            <img src="${song.thumbnails[0].url}" class="w-14 h-14 rounded-lg object-cover shadow-md">
                            <div class="flex-1 overflow-hidden">
                                <p class="font-bold text-sm truncate text-slate-100 uppercase tracking-tight">${song.title}</p>
                                <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">${song.artists[0]?.name || 'Artis Sunda'}</p>
                            </div>
                            <div class="text-emerald-500/80"><i class="fa-solid fa-circle-play text-2xl"></i></div>
                        `;
                        card.onclick = () => playSong(song);
                        playlist.appendChild(card);
                    });
                } catch (err) {
                    playlist.innerHTML = '<p class="text-center py-10 text-red-400/80 text-sm italic font-medium">Aduh Tuan, sambungan nuju gangguan. Cobi sakedap deui.</p>';
                }
            }
        });

        // Fungsi Putar Musik
        async function playSong(song) {
            playerBar.classList.remove('hidden');
            loader.classList.remove('hidden');
            
            document.getElementById('currentPoster').src = song.thumbnails[0].url;
            document.getElementById('currentTitle').innerText = "Nuju nyandak audio...";
            document.getElementById('currentArtist').innerText = song.artists[0]?.name || 'Artis Sunda';

            const videoUrl = `https://www.youtube.com/watch?v=${song.videoId}`;

            try {
                // Mencoba server audio Cobalt
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ 
                        url: videoUrl, 
                        downloadMode: 'audio',
                        audioFormat: 'mp3'
                    })
                });

                const data = await response.json();
                
                if (data.url) {
                    mainAudio.src = data.url;
                    mainAudio.load();
                    
                    const playPromise = mainAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(_ => {
                            loader.classList.add('hidden');
                            document.getElementById('currentTitle').innerText = song.title;
                        }).catch(error => {
                            loader.classList.add('hidden');
                            document.getElementById('currentTitle').innerText = "Klik Play, Tuan";
                        });
                    }
                } else {
                    throw new Error("Gagal mengambil URL");
                }
            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                document.getElementById('currentTitle').innerText = "Gagal muter audio";
                alert("Hapunten Tuan, server audio nuju sibuk. Mangga cobi lagu sanes.");
            }
        }

        function closePlayer() {
            mainAudio.pause();
            playerBar.classList.add('hidden');
        }
    </script>
</body>
</html>
