<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawihfy - Anti Gagal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070b14; color: #e2e8f0; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 pb-40">
    <h1 class="text-3xl font-black text-emerald-400 italic mb-6">KAWIHFY</h1>
    
    <input type="text" id="searchInput" placeholder="Cari lagu Sunda..." class="w-full p-4 glass rounded-2xl outline-none mb-8">

    <div id="playlist" class="space-y-3"></div>

    <div id="yt-container" class="hidden">
        <div id="yt-player"></div>
    </div>

    <div id="playerBar" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-3xl hidden flex flex-col gap-3">
        <div class="flex items-center gap-4">
            <img id="currentPoster" src="" class="w-12 h-12 rounded-xl object-cover">
            <div class="flex-1 min-w-0">
                <p id="currentTitle" class="font-bold text-sm truncate text-white uppercase">Judul Lagu</p>
                <p class="text-[10px] text-emerald-500 font-bold uppercase">YouTube Music Source</p>
            </div>
            <button onclick="closePlayer()" class="text-slate-400 p-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="flex justify-center gap-6 text-2xl text-emerald-400">
            <button onclick="ytPlayer.pauseVideo()"><i class="fa-solid fa-pause"></i></button>
            <button onclick="ytPlayer.playVideo()"><i class="fa-solid fa-play"></i></button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer;
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', { height: '0', width: '0', videoId: '' });
        }

        const searchInput = document.getElementById('searchInput');
        const playlist = document.getElementById('playlist');

        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                playlist.innerHTML = '<p class="text-center italic">Milari...</p>';
                const res = await fetch(`/api?q=${encodeURIComponent(searchInput.value + ' sunda')}`);
                const data = await res.json();
                playlist.innerHTML = '';
                data.forEach(song => {
                    const d = document.createElement('div');
                    d.className = 'p-3 glass rounded-xl flex justify-between items-center cursor-pointer hover:bg-emerald-500/10';
                    d.innerHTML = `<span class="truncate pr-4 uppercase text-xs font-bold text-slate-200">${song.title}</span><i class="fa-solid fa-play-circle text-emerald-400 text-2xl"></i>`;
                    d.onclick = () => {
                        document.getElementById('playerBar').classList.remove('hidden');
                        document.getElementById('currentPoster').src = song.thumbnails[0].url;
                        document.getElementById('currentTitle').innerText = song.title;
                        ytPlayer.loadVideoById(song.videoId);
                    };
                    playlist.appendChild(d);
                });
            }
        });

        function closePlayer() { ytPlayer.stopVideo(); document.getElementById('playerBar').classList.add('hidden'); }
    </script>
</body>
</html>
