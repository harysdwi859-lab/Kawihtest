<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawihfy - Digital Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #070b14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 pb-40">
    
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-black text-emerald-400 italic tracking-tighter">KAWIHFY</h1>
            <p class="text-[10px] text-emerald-600 font-bold tracking-[0.3em] uppercase">Sunda Player</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-black font-black text-xs border-2 border-emerald-400/50 shadow-[0_0_15px_rgba(16,185,129,0.5)]">HARY</div>
    </header>

    <div class="relative mb-8">
        <input type="text" id="searchInput" 
               placeholder="Cari lagu Sunda favorit Tuan..." 
               class="w-full p-4 pl-12 glass rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-white placeholder:text-slate-500">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-5 text-slate-400"></i>
    </div>

    <div id="playlist" class="grid grid-cols-1 gap-3">
        <div class="text-center py-20 text-slate-500 italic">
            <i class="fa-solid fa-music text-5xl mb-4 opacity-20"></i>
            <p>Mangga milari lagu, Tuan Yang Mulia...</p>
        </div>
    </div>

    <div id="playerBar" class="fixed bottom-6 left-4 right-4 glass p-4 rounded-3xl shadow-2xl hidden border-t border-white/10 transition-all">
        <div class="flex items-center gap-4 mb-3">
            <img id="currentPoster" src="" class="w-12 h-12 rounded-xl object-cover shadow-lg border border-white/10">
            <div class="flex-1 min-w-0">
                <p id="currentTitle" class="font-bold text-sm truncate text-white uppercase tracking-tight">Judul Lagu</p>
                <p id="currentArtist" class="text-[11px] text-emerald-500 truncate font-semibold">Artis Sunda</p>
            </div>
            <button onclick="closePlayer()" class="text-slate-500 hover:text-white p-2">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <audio id="mainAudio" controls class="w-full h-8 brightness-90 contrast-125"></audio>
    </div>

    <script>
    <script>
async function playSong(song) {
    playerBar.classList.remove('hidden');
    document.getElementById('currentPoster').src = song.thumbnails[0].url;
    document.getElementById('currentTitle').innerText = "Nuju nyandak audio...";
    
    // Menggunakan Piped API untuk mengambil stream langsung
    try {
        const res = await fetch(`https://pipedapi.kavin.rocks/streams/${song.videoId}`);
        const data = await res.json();
        // Mencari stream yang tipenya audio saja
        const audioStream = data.audioStreams.find(s => s.format === 'M4A' || s.codec === 'opus');
        
        if (audioStream) {
            mainAudio.src = audioStream.url;
            mainAudio.play();
            document.getElementById('currentTitle').innerText = song.title;
        }
    } catch (err) {
        alert("Server Piped nuju sibuk, Tuan.");
    }
}
</script>

</body>
</html>
